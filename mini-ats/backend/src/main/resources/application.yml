server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ats}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update   # use Flyway migrations in production
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
